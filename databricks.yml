bundle:
  name: sla_app_ecommerce_hypermarketing

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog name
    default: workspace
  schema_prefix:
    description: Prefix for medallion schemas. Actual schemas are <prefix>_bronze, <prefix>_silver, <prefix>_gold, <prefix>_ops.
    default: ecommerce_hypermarketing
  spark_version:
    description: Databricks Runtime version
    default: 15.4.x-scala2.12
  node_type_id:
    description: Job cluster node type
    default: Standard_DS3_v2
  timezone:
    description: Job schedule timezone
    default: Asia/Kolkata

targets:
  dev:
    mode: development
    default: true
    variables:
      schema_prefix: ecommerce_hypermarketing_dev
  prod:
    mode: production
    variables:
      schema_prefix: ecommerce_hypermarketing
